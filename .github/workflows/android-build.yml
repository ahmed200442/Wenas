name: Android Build & Release APK

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build:
    name: Build Wanaas APK with Gradle & Cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK & Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Accept Android SDK Licenses & Install SDK 36.1
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Prepare Keystore & Environment Configuration
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Build Debug APK v3.1 with Gradle
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          cp -f app/build/outputs/apk/debug/app-debug.apk ./wanas3.1.apk
          cp -f app/build/outputs/apk/debug/app-debug.apk ./wanas-v3.1.apk
          cp -f app/build/outputs/apk/debug/app-debug.apk ./wanas-latest.apk

      - name: Verify APK Output
        run: ls -lh ./wanas3.1.apk ./wanas-v3.1.apk ./wanas-latest.apk

      - name: Upload APK Artifact (v3.1)
        uses: actions/upload-artifact@v4
        with:
          name: wanas-v3.1-apk
          path: |
            ./wanas3.1.apk
            ./wanas-v3.1.apk
            ./wanas-latest.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK v3.1 to GitHub Releases
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1
          name: "تطبيق وَنَس v3.1 (Wanaas APK v3.1)"
          body: |
            ### 📲 تحميل تطبيق وَنَس v3.1 (Wanaas APK v3.1) المباشر
            اضغط على **`wanas3.1.apk`** أو **`wanas-v3.1.apk`** بالأسفل لتحميل وتثبيت النسخة **v3.1** مع خدمة البث الصوتي المباشر (WebRTC) على هاتفك.
          files: |
            ./wanas3.1.apk
            ./wanas-v3.1.apk
            ./wanas-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
